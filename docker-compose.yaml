services:
  agentgateway:
    # Set via version.env -- always launch with ./run-compose.sh, not `docker compose`.
    image: ${AGW_IMAGE_REPO}:${AGW_VERSION}
    volumes:
     - ./guardrail/credentials.json:/app/credentials.json
     - ./config/agentgateway_config.yaml:/app/config.yaml
     - ./config/openapi/petstore.json:/app/openapi.json
     - ./config/model-catalog.json:/app/model-catalog.json
     # SQLite store for config.database -- API-key budget state lives here, so it must be
     # a volume rather than the container filesystem or budgets reset on every restart.
     - agw_data:/data
    command:
     - "-f"
     - "/app/config.yaml"
    ports:
      - "3000:3000"   # data plane
      # Container-side bind is config.adminAddr: 0.0.0.0:15000; published to host
      # loopback only so the Admin UI is not exposed on the network. UI lives at /ui.
      #
      # Published on BOTH loopbacks. macOS /etc/hosts maps "localhost" to ::1 *before*
      # 127.0.0.1, so an IPv4-only publish leaves http://localhost:15000 dependent on the
      # browser falling back to IPv4. Chrome does; Firefox may not, and then the Admin UI
      # renders but every same-origin fetch (/api/config, /api/costs/...) dies with
      # "NetworkError when attempting to fetch resource" -- while curl from the same host
      # works, because curl retries on IPv4. Ports without a host-IP prefix (3000, 4000)
      # get both families automatically; adding a host IP opts out of that.
      - "127.0.0.1:15000:15000"
      - "[::1]:15000:15000"
      - "4000:4000"   # llm: section (API-key model access / budgets)
      - "15020:15020" # prometheus metrics
      - "15021:15021" # readiness
    environment:
      AWS_REGION: "us-west-2"
      # Reach Keycloak over the compose network rather than the host. Using
      # host.docker.internal:8080 makes gateway STARTUP depend on host port 8080 being free --
      # anything else bound there (e.g. a `kubectl port-forward ... 8080:8080`) is served
      # instead, and the JWKS fetch fails with "expected value at line 1 column 1", which is
      # fatal at config load. Overrides the value in config/.env (environment beats env_file).
      # Note this is only the JWKS URL; the `issuer:` in the config stays localhost:8080 so it
      # still matches the `iss` claim in tokens minted through the published port.
      KEYCLOAK_HOST: keycloak
    env_file:
     - ./config/.env
    # No container healthcheck: the v1.5.0 image is distroless -- it has no /bin/sh
    # and no wget, so both CMD-SHELL and wget-based probes fail with exit -1 forever.
    # The readiness endpoint is published above instead; probe it from the host:
    #   curl -sf http://localhost:15021/healthz/ready
    depends_on:
      # Every jwtAuth block resolves its JWKS at config load, so Keycloak must be
      # serving before agentgateway parses the config.
      keycloak:
        condition: service_healthy
      agw-data-init:
        condition: service_completed_successfully

  # Docker creates named volumes root-owned, but the agentgateway image runs as uid 65532,
  # so SQLite cannot create /data/agentgateway.db and startup fails with
  # "unable to open database file (code: 14)". Compose has no declarative way to set
  # volume ownership, so chown it once before agentgateway starts.
  agw-data-init:
    image: alpine:3.21
    command: ["sh", "-c", "chown 65532:65532 /data && chmod 700 /data"]
    volumes:
    - agw_data:/data

  # OIDC provider for the JWT / MCP authorization demos. Imports config/keycloak/mcp-realm.json
  # on first boot: realm mcp-realm, confidential client openweb-ui (secret "changeme"),
  # realm roles supply-chain + ai-agents, and users mcp-user / other-user (password user123).
  #
  # Dev mode + an in-memory H2 store, so the realm is re-imported clean on every
  # `up`. Changes made in the admin console do NOT survive `down`.
  keycloak:
    container_name: keycloak
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    ports:
    - "8080:8080"
    environment:
    - KC_BOOTSTRAP_ADMIN_USERNAME=admin
    - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    - KC_HEALTH_ENABLED=true
    - KC_HTTP_ENABLED=true
    volumes:
    # Directory import requires the file be named <realm>-realm.json, or Keycloak 26
    # refuses to boot: "File name / realm name mismatch".
    - ./config/keycloak/mcp-realm.json:/opt/keycloak/data/import/mcp-realm-realm.json:ro
    # The image ships no curl/wget, but /bin/sh is bash, so probe the management
    # health endpoint (:9000) over bash's /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  failover-429:
    container_name: failover-429
    restart: unless-stopped
    build:
      context: ./failover
    ports:
      - "127.0.0.1:9959:9959"

  jaeger:
    container_name: jaeger
    restart: unless-stopped
    image: jaegertracing/all-in-one:latest
    ports:
    - "127.0.0.1:16686:16686"
    - "127.0.0.1:14268:14268"
    - "127.0.0.1:4317:4317"
    environment:
    - COLLECTOR_OTLP_ENABLED=true

  redis:
    container_name: redis
    restart: unless-stopped
    image: redis:7.4.3
    ports:
    - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
    - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  ratelimit:
    container_name: ratelimit
    restart: unless-stopped
    image: envoyproxy/ratelimit:3e085e5b
    ports:
    - "8081:8081"
    environment:
    - REDIS_URL=redis:6379
    - USE_STATSD=false
    - LOG_LEVEL=info
    - REDIS_SOCKET_TYPE=tcp
    - RUNTIME_ROOT=/data
    - RUNTIME_SUBDIRECTORY=ratelimit
    - DISABLE_STATS=true
    volumes:
    - ./config/ratelimit-config.yaml:/data/ratelimit/config/config.yaml:ro
    command: ["/bin/ratelimit", "-config", "/data/ratelimit/config/config.yaml"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # /healthcheck is on the service's HTTP port (8080, container-internal), NOT 8081 --
      # 8081 is the gRPC port agentgateway talks to, and probing it gives "Connection reset
      # by peer". Also must use 127.0.0.1, since "localhost" resolves to ::1 here.
      # The old trailing "||","exit","1" were passed to wget as extra arguments: exec form
      # runs no shell, so they never did anything.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    container_name: prometheus
    restart: unless-stopped
    image: prom/prometheus:v3.7.2
    ports:
    - "127.0.0.1:9090:9090"
    volumes:
    - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    command:
    - '--config.file=/etc/prometheus/prometheus.yml'
    - '--storage.tsdb.path=/prometheus'
    - '--web.console.libraries=/etc/prometheus/console_libraries'
    - '--web.console.templates=/etc/prometheus/consoles'
    - '--storage.tsdb.retention.time=200h'
    - '--web.enable-lifecycle'
    healthcheck:
      # Needs -O /dev/null: without it wget tries to WRITE a file named "healthy" in the
      # working dir and fails with "can't open 'healthy': File exists" on the second probe.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    container_name: grafana
    restart: unless-stopped
    image: grafana/grafana:latest
    ports:
    - "127.0.0.1:3001:3000"
    volumes:
    - grafana_data:/var/lib/grafana
    - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=admin
    - GF_USERS_ALLOW_SIGN_UP=false
    healthcheck:
      # Same -O issue as prometheus: "can't open 'health': Permission denied".
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  agw_data:
  redis_data:
  prometheus_data:
  grafana_data: