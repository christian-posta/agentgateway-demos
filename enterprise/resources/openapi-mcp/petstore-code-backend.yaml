# EnterpriseAgentgatewayBackend: OpenAPI → custom MCP targets (Code Mode)
#
# Same targets as petstore-custom-backend.yaml but with toolMode: Code.
# In Code Mode the gateway collapses all targets into a single `run_code` tool.
# The model writes JavaScript; agentgateway executes it in a QuickJS sandbox
# with each petstore target bound as an async JS function.
#
# This file is NOT regenerated by the openapi-to-composite CLI — it is a copy
# of petstore-custom-backend.yaml with toolMode/codeMode added and the
# metadata.name changed to petstore-code-mcp.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: petstore-code-mcp
  namespace: agentgateway-system
spec:
  entMcp:
    toolMode: Code
    codeMode:
      timeout: 15s
    targets:
      - name: get-pet-by-id
        custom:
          description: "Find pet by ID. Returns a single pet."
          inputSchema:
            type: object
            additionalProperties: false
            required: [petId]
            properties:
              petId:
                type: integer
                format: int64
                description: "ID of pet to return"
          steps:
            - name: request
              http:
                backendRef:
                  group: ""
                  kind: Service
                  name: petstore
                  port: 8080
                method: GET
                path: '"/api/v3/pet/" + string(input.petId)'
          output: output.request

      - name: find-pets-by-status
        custom:
          description: "Finds Pets by status. Returns a list of pets matching the given status."
          inputSchema:
            type: object
            additionalProperties: false
            required: [status]
            properties:
              status:
                type: string
                enum: [available, pending, sold]
                description: "Status values to filter by"
          steps:
            - name: request
              http:
                backendRef:
                  group: ""
                  kind: Service
                  name: petstore
                  port: 8080
                method: GET
                path: '"/api/v3/pet/findByStatus?status=" + input.status'
          output: output.request

      - name: add-pet
        custom:
          description: "Add a new pet to the store."
          inputSchema:
            type: object
            additionalProperties: false
            required: [name, status]
            properties:
              name:
                type: string
                description: "Name of the pet"
              status:
                type: string
                enum: [available, pending, sold]
                description: "Pet status in the store"
          steps:
            - name: request
              http:
                backendRef:
                  group: ""
                  kind: Service
                  name: petstore
                  port: 8080
                method: POST
                path: '"/api/v3/pet"'
                body: '{"name": input.name, "status": input.status}'
                headers:
                  - name: Content-Type
                    value: '"application/json"'
          output: output.request

      - name: update-pet
        custom:
          description: "Update an existing pet by Id."
          inputSchema:
            type: object
            additionalProperties: false
            required: [id, name, status]
            properties:
              id:
                type: integer
                format: int64
                description: "Pet id to update"
              name:
                type: string
                description: "Updated name of the pet"
              status:
                type: string
                enum: [available, pending, sold]
                description: "Updated status of the pet"
          steps:
            - name: request
              http:
                backendRef:
                  group: ""
                  kind: Service
                  name: petstore
                  port: 8080
                method: PUT
                path: '"/api/v3/pet"'
                body: '{"id": input.id, "name": input.name, "status": input.status}'
                headers:
                  - name: Content-Type
                    value: '"application/json"'
          output: output.request

      - name: get-inventory
        custom:
          description: "Returns pet inventories by status. Returns a map of status codes to quantities."
          inputSchema:
            type: object
            additionalProperties: false
            properties: {}
          steps:
            - name: request
              http:
                backendRef:
                  group: ""
                  kind: Service
                  name: petstore
                  port: 8080
                method: GET
                path: '"/api/v3/store/inventory"'
          output: output.request

      - name: delete-pet
        custom:
          description: "Deletes a pet by Id."
          inputSchema:
            type: object
            additionalProperties: false
            required: [petId]
            properties:
              petId:
                type: integer
                format: int64
                description: "Pet id to delete"
          steps:
            - name: request
              http:
                backendRef:
                  group: ""
                  kind: Service
                  name: petstore
                  port: 8080
                method: DELETE
                path: '"/api/v3/pet/" + string(input.petId)'
          output: output.request

      # Chained target — same shape as in petstore-custom-backend.yaml.
      # In Code Mode this becomes one more JS binding the model can call;
      # the chaining happens server-side before the result returns to JS.
      - name: featured-pet
        custom:
          description: "Find pets by status, then fetch full details for the first match. Demonstrates chained HTTP steps + CEL output composition."
          inputSchema:
            type: object
            additionalProperties: false
            required: [status]
            properties:
              status:
                type: string
                enum: [available, pending, sold]
                description: "Status to search for"
          steps:
            - name: list
              http:
                backendRef:
                  group: ""
                  kind: Service
                  name: petstore
                  port: 8080
                method: GET
                path: '"/api/v3/pet/findByStatus?status=" + input.status'
            - name: detail
              http:
                backendRef:
                  group: ""
                  kind: Service
                  name: petstore
                  port: 8080
                method: GET
                path: '"/api/v3/pet/" + string(output.list[0].id)'
          output: |
            {
              "requested_status": input.status,
              "total_matches": size(output.list),
              "first_match_summary": {
                "id": output.list[0].id,
                "name": output.list[0].name
              },
              "first_match_details": output.detail
            }
