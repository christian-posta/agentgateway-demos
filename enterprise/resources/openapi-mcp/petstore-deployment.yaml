apiVersion: apps/v1
kind: Deployment
metadata:
  name: petstore
  namespace: agentgateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petstore
  template:
    metadata:
      labels:
        app: petstore
    spec:
      containers:
        - name: petstore
          image: docker.io/swaggerapi/petstore3:unstable
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: petstore
  namespace: agentgateway-system
spec:
  selector:
    app: petstore
  ports:
    - port: 8080
      targetPort: 8080
