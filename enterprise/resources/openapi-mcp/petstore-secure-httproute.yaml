# MCP-Auth–secured exposure of the petstore custom MCP backend.
#
# Reuses the existing `petstore-custom-mcp` EnterpriseAgentgatewayBackend
# (created by ./setup-custom-openapi-mcp.sh or applied directly here) and
# attaches an EnterpriseAgentgatewayPolicy that uses the newer
# `traffic.jwtAuthentication.mcp` field. This both:
#   1. Validates incoming JWTs (Strict mode — required for `mcp`).
#   2. Serves the MCP OAuth discovery endpoints
#      (.well-known/oauth-protected-resource and
#      .well-known/oauth-authorization-server) so MCP clients like
#      mcp-inspector / VS Code can complete the OAuth dance.
#
# Provider used here is Auth0 (matches ./resources/mcp/public-oauth.yaml).
# Replace the issuer / audiences / resourceMetadata URLs to point at your
# own Auth0 tenant and externally-reachable gateway URL.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: secure-openapi-mcp
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway
  rules:
    - matches:
        - path:
            type: Exact
            value: /secure-openapi-mcp/mcp
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/secure-openapi-mcp/mcp
        - path:
            type: Exact
            value: /.well-known/oauth-authorization-server/secure-openapi-mcp/mcp
      backendRefs:
        - name: petstore-code-mcp
          group: enterpriseagentgateway.solo.io
          kind: EnterpriseAgentgatewayBackend
---
# Auth0 JWKS backend. Named distinctly from `auth0-jwks` (used by other MCP
# demos) so this demo is self-contained, but the spec is identical — applying
# both is harmless. Replace `ceposta-solo.auth0.com` with your tenant.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: petstore-auth0-jwks
  namespace: agentgateway-system
spec:
  static:
    host: ceposta-solo.auth0.com
    port: 443
  policies:
    tls: {}
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: secure-openapi-mcp-policy
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: secure-openapi-mcp
  traffic:
    jwtAuthentication:
      # `mcp` requires exactly one provider and mode: Strict.
      mode: Strict
      providers:
        - issuer: https://ceposta-solo.auth0.com/
          audiences:
            - https://ceposta-agw.ngrok.io/mcp
          jwks:
            remote:
              # Leave off the initial `/` — matches resources/mcp/public-oauth.yaml.
              jwksPath: .well-known/jwks.json
              backendRef:
                name: petstore-auth0-jwks
                kind: AgentgatewayBackend
                group: agentgateway.dev
                port: 443
      mcp:
        provider: Auth0
        # Served at /.well-known/oauth-protected-resource/secure-openapi-mcp/mcp.
        # Replace the `https://ceposta-agw.ngrok.io` URLs with your gateway's
        # externally-reachable address (ngrok / LB / DNS) — Auth0 redirects
        # back here during the OAuth flow.
        resourceMetadata:
          resource: https://ceposta-agw.ngrok.io/secure-openapi-mcp/mcp
          authorizationServers:
            - https://ceposta-agw.ngrok.io/secure-openapi-mcp/mcp
          scopesSupported:
            - openid
            - profile
            - offline_access
          bearerMethodsSupported:
            - header
            - body
            - query
          resourceDocumentation: https://ceposta-agw.ngrok.io/secure-openapi-mcp/docs
          resourcePolicyUri: https://ceposta-agw.ngrok.io/secure-openapi-mcp/policies
    cors:
      allowOrigins:
        - "*"
      allowHeaders:
        - "*"
      allowMethods:
        - "*"
      allowCredentials: false
    headerModifiers:
      request:
        remove:
          - x-forwarded-for
          - x-forwarded-host
          - x-forwarded-proto
