          - x-forwarded-host
          - x-forwarded-proto          
        backendTLS: {}
        mcpAuthorization:
          rules:
          - 'mcp.tool.name == "microsoft_docs_fetch"'
          - "jwt.permissions.contains('call:agent') && mcp.tool.target == 'deepwiki'"
          - "jwt.permissions.contains('call:supply-chain') && (mcp.tool.target == 'microsoft' || mcp.tool.target == 'deepwiki')"        
        mcpAuthentication:
          issuer: https://ceposta-solo.auth0.com/
          jwks:
            url: https://ceposta-solo.auth0.com/.well-known/jwks.json
          audiences:
          - https://ceposta-agw.ngrok.io/mcp
          provider:
            auth0: {}
          resourceMetadata:
            authorizationServers:
            - https://ceposta-agw.ngrok.io/secure/mcp          
            resource: https://ceposta-agw.ngrok.io/secure/mcp
            scopesSupported:
            - profile
            - openid
            - offline_access
            bearerMethodsSupported:
            - header
            - body
            - query
            resourceDocumentation: https://ceposta-agw.ngrok.io/secure/mcp/docs
            resourcePolicyUri: https://ceposta-agw.ngrok.io/secure/mcp/policies 
# ============================================================
# NEW in 1.5 (model-router path): API-key model access control.
#
# This is a SEPARATE serving path from binds: above. It exists because
# `apiKey.keys[].allowedModels` is enforced in ModelRouter::resolve
# (llm/model_router.rs:181), which only runs for models declared here -- an inline
# `ai:` backend under binds: never reaches it. Same architectural split as
# `ai.routes`: the model-router path and the inline-backend path are not the same
# code, and features do not automatically apply to both.
#
# Served on :4000 (published in docker-compose.yaml) to avoid colliding with the
# route paths on :3000.
#
#   # allowed model -> 200
#   curl localhost:4000/v1/chat/completions -H 'Authorization: Bearer agw_sk_small' \
#     -H 'Content-Type: application/json' \
#     -d '{"model":"cheap","messages":[{"role":"user","content":"hi"}]}'
#
#   # model exists but is not on this key's allow-list -> refused
#   curl localhost:4000/v1/chat/completions -H 'Authorization: Bearer agw_sk_small' \
#     -H 'Content-Type: application/json' \
#     -d '{"model":"smart","messages":[{"role":"user","content":"hi"}]}'
#
#   # /v1/models is filtered per key -- each key only discovers what it may call
#   curl localhost:4000/v1/models -H 'Authorization: Bearer agw_sk_small'
# ============================================================
llm:
  port: 4000
  policies:
    apiKey:
      mode: strict
      location:
        header: {name: authorization, prefix: 'Bearer '}
      keys:
      # Restricted key: may only reach the cheap model.
      - key: agw_sk_small
        metadata: {name: Cheap-only key, owner: platform}
        allowedModels: ["cheap"]
        budgets:
        - name: hourly-tokens
          limit: {unit: Tokens, amount: 500}
          window: {rolling: 1h}
          onBudgetExceeded: Block
      # Unrestricted key: no allowedModels field at all means "no constraint".
      # (An EMPTY list would mean the opposite -- deny everything.)
      - key: agw_sk_all
        metadata: {name: Unrestricted key, owner: platform}
  providers:
  - name: openai
    provider: openAI
    params:
      # NOTE: interpolation scans this whole file, comments included. A dollar sign
      # followed by an uppercase name or a digit is treated as a variable reference and
      # a missing one aborts startup ("error looking key ... up"). That is why dollar
      # amounts in comments above are written as USD rather than with a symbol.
      apiKey: $OPENAI_API_KEY
  models:
  - name: cheap
    provider:
      reference: openai
    params:
      model: gpt-4o-mini
  - name: smart
    provider:
      reference: openai
    params:
      model: gpt-4o
