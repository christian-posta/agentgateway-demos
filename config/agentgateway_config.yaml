          - name: exa-ai
            mcp:
              host: "mcp.exa.ai"
              port: 443
              path: "/mcp"
      policies:
        jwtAuth:
          mode: optional
          issuer: http://localhost:8080/realms/mcp-realm
          audiences: [account]
          jwks:
